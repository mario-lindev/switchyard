name: Release lab CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run rehearse -- --seed=4271 --out=guarded-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-rehearsal-evidence
          path: guarded-evidence.json
